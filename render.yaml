services:
  - type: web
    name: renvora-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: renvora-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: renvora-db
    region: oregon
    plan: free
