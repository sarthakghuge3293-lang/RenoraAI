<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Renvora AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 420px;
        }

        .register-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 8px;
        }

        .logo h1 {
            font-size: 28px;
            color: #2563eb;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #2563eb;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 8px 0 20px;
            font-size: 13px;
            color: #6b7280;
            line-height: 1.4;
        }

        .terms input {
            margin-top: 3px;
        }

        .terms a {
            color: #2563eb;
            text-decoration: none;
        }

        .register-btn {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .register-btn:hover {
            background: #1d4ed8;
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #6b7280;
        }

        .login-text a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .message {
            display: none;
            margin-bottom: 15px;
            padding: 10px 12px;
            border-radius: 7px;
            font-size: 13px;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #15803d;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 25px 20px;
            }

            .logo h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <div class="logo">
                <h1>Renvora AI</h1>
            </div>

            <p class="subtitle">
                Create your account to get started
            </p>

            <div id="message" class="message"></div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('password', this)"
                        >
                            Show
                        </button>

                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('confirmPassword', this)"
                        >
                            Show
                        </button>

                    </div>
                </div>

                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <label for="terms">
                        I agree to the
                        <a href="#">Terms & Privacy Policy</a>
                    </label>

                </div>

                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Account
                </button>

            </form>

            <p class="login-text">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </div>

    </div>

<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);

        if (input.type === "password") {
            input.type = "text";
            button.textContent = "Hide";
        } else {
            input.type = "password";
            button.textContent = "Show";
        }
    }

    document
        .getElementById("registerForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();

            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim().toLowerCase();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const terms =
                document.getElementById("terms").checked;

            const message =
                document.getElementById("message");

            const button =
                document.querySelector(".register-btn");


            // ====================================================
            // VALIDATION
            // ====================================================

            if (!name || !email || !password || !confirmPassword) {

                message.textContent =
                    "Please fill all fields.";

                message.className =
                    "message error";

                message.style.display =
                    "block";

                return;
            }


            if (password.length < 6) {

                message.textContent =
                    "Password must be at least 6 characters.";

                message.className =
                    "message error";

                message.style.display =
                    "block";

                return;
            }


            if (password !== confirmPassword) {

                message.textContent =
                    "Passwords do not match.";

                message.className =
                    "message error";

                message.style.display =
                    "block";

                return;
            }


            if (!terms) {

                message.textContent =
                    "Please accept the Terms & Privacy Policy.";

                message.className =
                    "message error";

                message.style.display =
                    "block";

                return;
            }


            // ====================================================
            // DISABLE BUTTON
            // ====================================================

            button.disabled = true;

            button.textContent =
                "Creating Account...";

            message.style.display =
                "none";


            // ====================================================
            // API REQUEST
            // ====================================================

            try {

                const response =
                    await fetch(
                        "/mobile/auth/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials: "same-origin",

                            body: JSON.stringify({
                                name: name,
                                email: email,
                                password: password
                            })
                        }
                    );


                const data =
                    await response.json();


                // ====================================================
                // SUCCESS
                // ====================================================

                if (
                    response.ok &&
                    data.success
                ) {

                    message.textContent =
                        "Registration successful! Redirecting to login...";

                    message.className =
                        "message success";

                    message.style.display =
                        "block";


                    setTimeout(
                        function () {

                            window.location.href =
                                "/login";

                        },
                        800
                    );

                    return;
                }


                // ====================================================
                // ERROR
                // ====================================================

                message.textContent =
                    data.message ||
                    "Registration failed.";

                message.className =
                    "message error";

                message.style.display =
                    "block";


            } catch (error) {

                console.error(
                    "Registration error:",
                    error
                );


                message.textContent =
                    "Unable to connect to the server.";

                message.className =
                    "message error";

                message.style.display =
                    "block";


            } finally {

                button.disabled =
                    false;

                button.textContent =
                    "Create Account";
            }
        });
</script>
</body>
</html>
