{% extends "base.html" %}

{% block title %}Renvora AI{% endblock %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<div class="app-container">

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

        <div class="logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Renvora AI Logo" class="sidebar-logo">
            <span>Renvora AI</span>
        </div>

        <button class="new-chat-btn">
            <i class="bi bi-plus-lg"></i>
            New Chat
        </button>

        <div class="search-box">
            <i class="bi bi-search"></i>
            <input type="text" id="chatSearchInput" placeholder="Search chats...">
        </div>

        <div class="chat-history">

            <div class="history-title">
                Recent Chats
            </div>
            
            <div id="sessionList" class="session-list" style="margin-bottom: 20px;">
                <!-- Dynamic sessions will be populated here -->
            </div>
            
            <div class="history-title" style="margin-top: 20px;">
                📁 My Documents
            </div>
            
            <div id="documentList" class="document-list">
                <div class="chat-item active" id="searchAllDoc" onclick="setActiveDocument(null)">
                    <i class="bi bi-search"></i>
                    <span class="doc-name">Search Across All PDFs</span>
                </div>
                <!-- Dynamic documents will be populated here -->
            </div>
            
        </div>
        
        <div class="sidebar-footer">

            <a href="#" id="openUploadModalBtn">
                <i class="bi bi-cloud-upload"></i>
                <span>+ Upload Document</span>
            </a>



            <a href="/logout">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </a>
 
        </div>

    </aside>

    <!-- Main Chat -->
    <main class="chat-container">

        <div class="chat-header">
            <button id="mobileMenuBtn" class="mobile-menu-btn">
                <i class="bi bi-list"></i>
            </button>
            <h2>Renvora AI</h2>
            <button id="shareChatBtn" class="share-chat-btn" style="margin-left:auto; background:none; border:none; color:white; cursor:pointer; font-size:1.2rem; display:none;" title="Share Chat">
                <i class="bi bi-share"></i>
            </button>
        </div>

        <div class="chat-body" id="chatBody">

            <div class="welcome-screen">

                <h1>Hello 👋</h1>

                <p>How can I help you today?</p>

            </div>

        </div>

        <div class="chat-input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Ask anything..."
                autocomplete="off"
            >

            <button id="sendBtn">

                <i class="bi bi-send-fill"></i>

            </button>

        </div>

    </main>

</div>

<!-- Upload PDF Modal -->
<div id="uploadModal" class="upload-modal-overlay" style="display: none;">
    <div class="upload-modal-content">
        <div class="upload-modal-header">
            <h3>Upload Document</h3>
            <button id="closeUploadModalBtn" class="close-modal-btn"><i class="bi bi-x-lg"></i></button>
        </div>
        
        <label for="pdfFile" class="upload-box" id="dropZone">
            <i class="bi bi-cloud-arrow-up upload-icon"></i>
            <h4>Drag & Drop or Choose Document</h4>
            <p>Upload a document to chat with it</p>
            <input type="file" id="pdfFile" accept=".pdf,.xlsx,.xls,.csv,.docx,.pptx" style="opacity: 0; position: absolute; z-index: -1; width: 0.1px; height: 0.1px;">
        </label>
        
        <div id="currentPdf" class="current-pdf">
            No PDF Selected
        </div>
        
        <div id="uploadProgress" class="upload-progress" style="display: none;">
            <div class="loading-spinner"></div>
            <span id="uploadStatusText">Uploading...</span>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/chat.js') }}"></script>

{% endblock %}
